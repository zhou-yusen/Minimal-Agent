[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minimal-agent-runtime"
version = "0.1.0"
description = "A small, explainable, testable Agent Runtime"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_agent"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires explicit opt-in and a real LLM API credential",
]
